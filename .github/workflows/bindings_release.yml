  kotlin:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Build JNI Libraries
        run: cargo run --bin uniffi-bindgen generate ./src/drop.udl --language kotlin --out-dir ./target/kotlin

      - name: Create Kotlin Bindings ZIP
        run: |
          cd ./target/kotlin
          zip -r ../../kotlin-bindings.zip ./dev
          cd -

      - name: Release Kotlin Bindings ZIP
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "./uniffi/drop/kotlin-bindings.zip"
