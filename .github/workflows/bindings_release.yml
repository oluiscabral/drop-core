name: Bindings Release

on:
  push:
    tags:
      - "bindings.v[0-9]+.[0-9]+.[0-9]+"

defaults:
  run:
    working-directory: ./uniffi/drop

jobs:
  aarch64-linux-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install `cargo-ndk`
        run: cargo install cargo-ndk

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Build JNI Libraries
        run: cargo ndk --output-dir ./target/release/jniLibs --target aarch64-linux-android build --release

      - name: Create JNI Libraries ZIP
        run: |
          cd ./target/release
          zip -r ../../aarch64-linux-android-jniLibs.zip ./jniLibs
          cd -

      - name: Release JNI Libraries ZIP
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "./uniffi/drop/aarch64-linux-android-jniLibs.zip"

  armv7-linux-androideabi:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install `cargo-ndk`
        run: cargo install cargo-ndk

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
