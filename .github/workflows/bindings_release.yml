      - name: Release JNI Libraries ZIP
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "./uniffi/drop/armv7-linux-androideabi-jniLibs.zip"

  i686-linux-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-linux-android

      - name: Install `cargo-ndk`
        run: cargo install cargo-ndk

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Build JNI Libraries
        run: cargo ndk --output-dir ./target/release/jniLibs --target i686-linux-android build --release

      - name: Create JNI Libraries ZIP
        run: |
          cd ./target/release
          zip -r ../../i686-linux-android-jniLibs.zip ./jniLibs
          cd -

      - name: Release JNI Libraries ZIP
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "./uniffi/drop/i686-linux-android-jniLibs.zip"

  x86_64-linux-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install `cargo-ndk`
        run: cargo install cargo-ndk

      - name: Set up Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Build JNI Libraries
        run: cargo ndk --output-dir ./target/release/jniLibs --target x86_64-linux-android build --release

      - name: Create JNI Libraries ZIP
        run: |
          cd ./target/release
